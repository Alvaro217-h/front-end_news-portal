<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoNews - Contacto</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
                EcoNews
            </a>
            <!-- Menú de enlaces -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center text-white gap-1" href="favoritos.html">
                            Favoritos
                            <span id="fav-count" class="badge bg-warning text-dark rounded-pill">0</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center text-white gap-1" href="gestion.html">
                            Gestión (CRUD)
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center text-white gap-1" href="contacto.html">
                            Contacto
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </header>

    <main class="container my-4">
        <section>
            <!-- Tarjeta del Formulario de Contacto -->
            <div class="card shadow-sm p-4 mx-auto" style="max-width: 600px;">
                <!-- Encabezado -->
                <div class="mb-3">
                    <h3 class="fw-bold d-flex align-items-center gap-2">
                        <i data-lucide="mail"></i> Ponte en Contacto
                    </h3>
                    <p class="text-muted">¿Tienes preguntas o experiencias que compartir? Escríbenos.</p>
                </div>

                <form id="contact-form">
                    <div class="row g-3">
                        <!-- Nombre Completo -->
                        <div class="col-12">
                            <label class="form-label fw-bold">Nombre Completo</label>
                            <div class="input-group">
                                <span class="input-group-text"></span>
                                <input type="text" id="contact-name" class="form-control" placeholder="Ej: Maria Gómez"
                                    required>
                            </div>
                        </div>

                        <!-- Correo Electrónico -->
                        <div class="col-12">
                            <label class="form-label fw-bold">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text"></span>
                                <input type="email" id="contact-email" class="form-control"
                                    placeholder="maria@ejemplo.com" required>
                            </div>
                        </div>

                        <!-- Mensaje -->
                        <div class="col-12">
                            <label class="form-label fw-bold">Mensaje</label>
                            <textarea id="contact-message" class="form-control" rows="4"
                                placeholder="Escribe tu consulta o experiencia..." required></textarea>
                        </div>
                    </div>

                    <!-- Botón de Envío -->
                    <button type="submit"
                        class="btn btn-primary w-100 mt-4 d-flex align-items-center justify-content-center gap-2 fw-bold">
                        Enviar Mensaje
                    </button>
                </form>
            </div>
        </section>
    </main>

    <footer class="bg-primary text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-1">&copy; 2026 EcoNews - Todos los derechos reservados.</p>
            <small class="text-white-50 d-block">Prototipo con HTML, CSS, JavaScript, Bootstrap.</small>
        </div>
    </footer>

    <script src="scritp_cards.js"></script>
</body>

</html>
