<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoNews - Gestión</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
                EcoNews
            </a>
            <!-- Menú de enlaces -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center text-white gap-1" href="favoritos.html">
                            Favoritos
                            <span id="fav-count" class="badge bg-warning text-dark rounded-pill">0</span>
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center text-white gap-1" href="gestion.html">
                            Gestión (CRUD)
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center text-white gap-1" href="contacto.html">
                            Contacto
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </header>

    <main class="container my-4">
        <section>
            <!-- Tarjeta del Formulario -->
            <div class="card shadow-sm p-4 mb-4">
                <div class="mb-3">
                    <h3 class="fw-bold d-flex align-items-center gap-2">
                        Publicar Nueva Noticia
                    </h3>
                    <p class="text-muted">Completa el formulario para crear noticias.</p>
                </div>

                <form id="crud-form">
                    <div class="row g-3">
                        <!-- Título -->
                        <div class="col-12">
                            <label class="form-label fw-bold">Título de la noticia</label>
                            <div class="input-group">
                                <span class="input-group-text"></span>
                                <input type="text" id="news-title" class="form-control"
                                    placeholder="Ej: Nueva Ruta Ecológica" required>
                            </div>
                        </div>

                        <!-- Categoría -->
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-bold">Categoría</label>
                            <div class="input-group">
                                <span class="input-group-text"></span>
                                <select id="news-category" class="form-select">
                                    <option value="Tecnología">Tecnología</option>
                                    <option value="Educación">Educación</option>
                                    <option value="Turismo">Turismo</option>
                                    <option value="Comercio">Comercio</option>
                                </select>
                            </div>
                        </div>

                        <!-- URL de Imagen -->
                        <div class="col-12 col-md-6">
                            <label class="form-label fw-bold">URL de la Imagen</label>
                            <div class="input-group">
                                <span class="input-group-text"></span>
                                <input type="url" id="news-image" class="form-control"
                                    placeholder="https://images.com/..." required>
                            </div>
                        </div>

                        <!-- Resumen Breve -->
                        <div class="col-12">
                            <label class="form-label fw-bold">Resumen Breve</label>
                            <div class="input-group">
                                <span class="input-group-text"></span>
                                <input type="text" id="news-short-desc" class="form-control"
                                    placeholder="Una descripción de la noticia" required>
                            </div>
                        </div>

                        <!-- Contenido Completo -->
                        <div class="col-12">
                            <label class="form-label fw-bold">Contenido Completo</label>
                            <textarea id="news-full-desc" class="form-control" rows="4"
                                placeholder="Escribe aquí el cuerpo de la noticia en detalle..." required></textarea>
                        </div>
                    </div>

                    <!-- Botón de Envío -->
                    <button type="submit"
                        class="btn btn-warning w-100 mt-4 d-flex align-items-center justify-content-center gap-2 fw-bold">
                        Publicar Noticia
                    </button>
                </form>
            </div>

            <!-- Sección Lista de Noticias -->
            <h3 class="mb-3 fw-bold">Gestión de Noticias Existentes</h3>
            <div id="crud-container" class="row g-3"></div>
        </section>
    </main>

    <footer class="bg-primary text-white text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-1">&copy; 2026 EcoNews - Todos los derechos reservados.</p>
            <small class="text-white-50 d-block">Prototipo con HTML, CSS, JavaScript, Bootstrap.</small>
        </div>
    </footer>

    <script src="scritp_cards.js"></script>
</body>

</html>
